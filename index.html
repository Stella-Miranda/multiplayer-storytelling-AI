<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #e8ff00;
      --text: #e8e8e8;
      --muted: #555;
      --sys: #444;
      --radius: 4px;
    }
    #top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #mode-toggle {
      background: #1b2b44;
      color: #7cc4ff;
      border: 1px solid #2f4d74;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      padding: 7px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: 0.15s;
    }

    #mode-toggle.orange {
      background: #3b2400;
      color: #ffb347;
      border-color: #6b3d00;
    }

    #ai-send-btn {
      background: #ff9f1a;
      color: #000;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      flex-shrink: 0;
    }

    #ai-send-btn:hover {
      opacity: 0.85;
    }

    .msg.orange .msg-bubble {
      background: #2a1a00;
      border-color: #6b3d00;
    }

    .msg.orange .msg-meta {
      color: #ffb347;
    }

    .msg.ai .msg-bubble {
      background: #1d0029;
      border-color: #5e1f7a;
    }

    .msg.ai .msg-meta {
      color: #d58cff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── JOIN SCREEN ── */
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      height: 100dvh;
      padding: 24px;
    }

    #join-screen h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: -0.03em;
    }

    #join-screen h1 span { color: var(--accent); }

    #join-screen input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1rem;
      padding: 12px 16px;
      width: 100%;
      max-width: 320px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s;
    }

    #join-screen input:focus { border-color: var(--accent); }

    #join-screen button {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 12px 32px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.15s;
    }

    #join-screen button:hover { opacity: 0.85; }

    /* ── CHAT SCREEN ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header .logo {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    header .logo span { color: var(--accent); }

    #online-count {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    #online-count b { color: var(--accent); }

    .chat-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      animation: fadeUp 0.18s ease;
    }

    .msg.self { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; }

    .msg-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg.self .msg-meta { color: var(--accent); opacity: 0.7; }

    .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 9px 13px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.self .msg-bubble {
      background: #1e2200;
      border-color: #3a4800;
    }

    .sys-msg {
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--sys);
      padding: 6px 0;
    }

    /* ── SIDEBAR (online users) ── */
    #sidebar {
      width: 160px;
      border-left: 1px solid var(--border);
      padding: 16px 12px;
      overflow-y: auto;
      flex-shrink: 0;
      display: none;
    }

    @media(min-width: 600px) { #sidebar { display: block; } }

    #sidebar h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      padding: 4px 0;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── INPUT BAR ── */
    #input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s;
    }

    #msg-input:focus { border-color: var(--accent); }

    #send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    #send-btn:hover { opacity: 0.85; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <h1>enter <span>chat/</span></h1>
  <input id="name-input" type="text" placeholder="your name" maxlength="24" autocomplete="off" />
  <button id="join-btn">join →</button>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <header>
    <div class="logo">chat<span>/</span></div>
    <div id="online-count"><b>0</b> online</div>
  </header>

  <div class="chat-body">
    <div id="messages"></div>
    <div id="sidebar">
      <h3>online</h3>
      <div id="user-list"></div>
    </div>
  </div>

  <div id="input-bar">
  
    <div id="top-controls">
      <button id="mode-toggle">BLUE MODE</button>
    </div>
  
    <input
      id="msg-input"
      type="text"
      placeholder="type a message…"
      maxlength="500"
      autocomplete="off"
    />
  
    <button id="send-btn">send</button>
    <button id="ai-send-btn">Send to AI</button>
  
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  let myName = "";
  let currentMode = "blue";

  // =========================
  // ELEMENTS
  // =========================

  const joinScreen  = document.getElementById("join-screen");
  const chatScreen  = document.getElementById("chat-screen");

  const nameInput   = document.getElementById("name-input");
  const joinBtn     = document.getElementById("join-btn");

  const messages    = document.getElementById("messages");

  const msgInput    = document.getElementById("msg-input");

  const sendBtn     = document.getElementById("send-btn");
  const aiSendBtn   = document.getElementById("ai-send-btn");

  const modeToggle  = document.getElementById("mode-toggle");

  const userList    = document.getElementById("user-list");
  const onlineCount = document.getElementById("online-count");

  // =========================
  // JOIN
  // =========================

  function join() {
    const name = nameInput.value.trim();

    if (!name) {
      nameInput.focus();
      return;
    }

    myName = name;

    socket.emit("join", name);

    joinScreen.style.display = "none";
    chatScreen.style.display = "flex";

    msgInput.focus();
  }

  joinBtn.addEventListener("click", join);

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") join();
  });

  // =========================
  // MODE TOGGLE
  // =========================

  function updateModeUI() {

    if (currentMode === "blue") {

      modeToggle.textContent = "BLUE MODE";
      modeToggle.classList.remove("orange");

      msgInput.placeholder =
        "casual public chat...";

    } else {

      modeToggle.textContent = "ORANGE MODE";
      modeToggle.classList.add("orange");

      msgInput.placeholder =
        "building AI context...";
    }
  }

  modeToggle.addEventListener("click", () => {

    currentMode =
      currentMode === "blue"
        ? "orange"
        : "blue";

    updateModeUI();
  });

  updateModeUI();

  // =========================
  // SEND MESSAGE
  // =========================

  function send() {

    const text = msgInput.value.trim();

    if (!text) return;

    // -------------------------
    // BLUE MODE
    // -------------------------

    if (currentMode === "blue") {

      socket.emit("message", text);

    }

    // -------------------------
    // ORANGE MODE
    // -------------------------

    else {

      socket.emit("ai-message", text);

    }

    msgInput.value = "";
    msgInput.focus();
  }

  sendBtn.addEventListener("click", send);

  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });

  // =========================
  // SEND TO AI
  // =========================

  aiSendBtn.addEventListener("click", () => {

    socket.emit("send-to-ai");

  });

  // =========================
  // RECEIVE MESSAGES
  // =========================

  socket.on("message", ({ username, text, time, mode }) => {

    const isSelf = username === myName;

    const wrap = document.createElement("div");

    let extraClass = "";

    if (mode === "orange") {
      extraClass = "orange";
    }

    if (mode === "ai") {
      extraClass = "ai";
    }

    wrap.className =
      `msg ${isSelf ? "self" : "other"} ${extraClass}`;

    wrap.innerHTML = `
      <div class="msg-meta">
        ${isSelf ? "you" : escHtml(username)} · ${time}
      </div>

      <div class="msg-bubble">
        ${escHtml(text)}
      </div>
    `;

    messages.appendChild(wrap);

    messages.scrollTop = messages.scrollHeight;
  });

  // =========================
  // SYSTEM MESSAGE
  // =========================

  socket.on("system", (text) => {

    const el = document.createElement("div");

    el.className = "sys-msg";

    el.textContent = text;

    messages.appendChild(el);

    messages.scrollTop = messages.scrollHeight;
  });

  // =========================
  // USER LIST
  // =========================

  socket.on("user-list", (users) => {

    onlineCount.innerHTML =
      `<b>${users.length}</b> online`;

    userList.innerHTML = users.map(u => `
      <div class="user-item">
        <span class="dot"></span>
        ${escHtml(u)}
      </div>
    `).join("");
  });

  // =========================
  // ESCAPE HTML
  // =========================

  function escHtml(str) {

    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
